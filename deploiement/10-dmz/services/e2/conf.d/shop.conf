map $ssl_server_name $mv_sni_backend {
    default "";
    shop.maisonverte.fr shop-dmz01:80;
}

server {
    listen 443 ssl;
    server_name shop.maisonverte.fr;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $shop_backend shop-dmz01:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://$shop_backend;
    }
}

# PHPMailer 4.6 payloads replace Host with command syntax. When that Host
# cannot select a named vhost, route only an explicit shop TLS SNI session.
server {
    listen 443 ssl default_server;
    server_name _;

    if ($mv_sni_backend = "") { return 421; }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://$mv_sni_backend;
    }
}
