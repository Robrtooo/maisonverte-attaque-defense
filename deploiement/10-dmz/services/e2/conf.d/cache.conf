server {
    listen 443 ssl;
    server_name cache.maisonverte.fr;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Intentional Vulhub Mistake 2: /files../ traverses the /home alias.
    location /files {
        alias /home/;
    }

    location /internal/search/ {
        if ($http_x_mv_search_token != "mv-search-a7-route") { return 403; }
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $search_backend search-srv01:9200;
        rewrite ^/internal/search/(.*)$ /$1 break;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://$search_backend;
    }
}
