services:
  mysql:
    image: mysql:5
    pull_policy: never
    container_name: shop-dmz01-db
    restart: unless-stopped
    mem_limit: 768m
    environment:
      MYSQL_ROOT_PASSWORD: ${MV_E3_DB_PASSWORD:-runtime-secret-required}
      MYSQL_DATABASE: wordpress
    volumes:
      - e3-mysql-data:/var/lib/mysql
    networks:
      - mv-e3-db
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  wordpress:
    image: vulhub/wordpress:4.6
    pull_policy: never
    container_name: shop-dmz01
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: ${MV_E3_DB_PASSWORD:-runtime-secret-required}
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - e3-wordpress-data:/var/www/html
      - ./content/maisonverte-ops.txt:/opt/maisonverte/ops.txt:ro
      - ../../../state/services/e3/flag.txt:/opt/maisonverte/flag.txt:ro
    networks:
      - net-dmz
      - mv-c-edge
      - mv-e3-db
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",80); exit($$s ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  e3-mysql-data:
  e3-wordpress-data:

networks:
  net-dmz:
    external: true
    name: net-dmz
  mv-c-edge:
    external: true
    name: mv-c-edge
  mv-e3-db:
    internal: true
