services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.24
    pull_policy: never
    container_name: elk-admin01-es
    restart: unless-stopped
    mem_limit: 1024m
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=maisonverte-defense
      - node.name=elk-admin01-es
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elk-esdata:/usr/share/elasticsearch/data
      - ./elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    networks:
      - net-admin
    expose:
      - "9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.24
    pull_policy: never
    container_name: elk-admin01-kibana
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - NODE_OPTIONS=--max-old-space-size=384
    volumes:
      - ./kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    networks:
      - net-admin
    ports:
      - "127.0.0.1:5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5601/api/status >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  filebeat:
    image: docker.elastic.co/beats/filebeat:7.17.24
    pull_policy: never
    container_name: elk-admin01-filebeat
    restart: unless-stopped
    user: root
    mem_limit: 128m
    depends_on:
      - elasticsearch
    command: ["--strict.perms=false", "-e"]
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ../../../state/services/elk/filebeat-data:/usr/share/filebeat/data
    networks:
      - net-admin
    healthcheck:
      test: ["CMD-SHELL", "filebeat test output --strict.perms=false -e >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  net-admin:
    external: true
    name: net-admin

volumes:
  elk-esdata:
