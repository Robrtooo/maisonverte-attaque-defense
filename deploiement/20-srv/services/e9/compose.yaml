services:
  samba:
    image: vulhub/samba:4.6.3
    pull_policy: never
    container_name: files-srv01
    restart: unless-stopped
    mem_limit: 256m
    tty: true
    expose:
      - "445"
    volumes:
      - ./smb.conf:/usr/local/samba/etc/smb.conf:ro
      - ../../../state/services/e9/share:/home/share
      - ../../../state/services/e9/flag.txt:/opt/maisonverte/flag.txt:ro
    networks:
      - mv-c-core
      - mv-c-spec
    healthcheck:
      test: ["CMD-SHELL", "test -r /usr/local/samba/etc/smb.conf && test -d /home/share && kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  mv-c-core:
    external: true
    name: mv-c-core
  mv-c-spec:
    external: true
    name: mv-c-spec
