services:
  elasticsearch:
    image: vulhub/elasticsearch:1.4.2
    pull_policy: never
    container_name: search-srv01
    restart: unless-stopped
    mem_limit: 768m
    environment:
      ES_HEAP_SIZE: 384m
    expose:
      - "9200"
    volumes:
      - e7_esdata:/usr/share/elasticsearch/data
      - ../../../state/services/e7/flag.txt:/opt/maisonverte/flag.txt:ro
    networks:
      - mv-a-edge
      - mv-a-core
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  e7_esdata:

networks:
  mv-a-edge:
    external: true
    name: mv-a-edge
  mv-a-core:
    external: true
    name: mv-a-core
