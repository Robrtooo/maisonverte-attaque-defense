services:
  crm:
    image: nginx:1.27.4-alpine
    pull_policy: never
    container_name: crm-srv01
    restart: unless-stopped
    mem_limit: 128m
    expose:
      - "80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/usr/share/nginx/html:ro
      - ../../../data:/srv/maisonverte-data:ro
    networks:
      - net-srv
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health && test -s /srv/maisonverte-data/clients.json"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  net-srv:
    external: true
    name: net-srv
