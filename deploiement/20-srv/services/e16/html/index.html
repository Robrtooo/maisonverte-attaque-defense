<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MaisonVerte CRM</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;background:#f4f7f2;color:#17321d}header{background:#245c33;color:white;padding:1.2rem 2rem}main{max-width:960px;margin:2rem auto;padding:0 1rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem}.panel{background:white;border:1px solid #d8e2d5;border-radius:6px;padding:1rem}h1,h2{margin:.2rem 0 1rem}small{color:#526655}.status{color:#1b6b35;font-weight:700}
  </style>
</head>
<body>
  <header><h1>MaisonVerte CRM</h1><div>Segments clients et campagnes</div></header>
  <main>
    <div class="grid">
      <section class="panel"><h2>Clients</h2><p>30 profils de demonstration</p><small>Programme de fidelite alimente</small></section>
      <section class="panel"><h2>Campagnes</h2><p>Jardin de saison</p><small>Segment Or et Argent</small></section>
      <section class="panel"><h2>Historique</h2><p class="status">Service operationnel</p><small>Dernier contact fictif: 2026-08-31</small></section>
    </div>
  </main>
</body>
</html>
